name: release-publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        run: |
          python scripts/version.py --check
          PYTHONPATH=scripts python -c 'import os; from version import TAG; assert os.environ["GITHUB_REF"] == "refs/tags/" + TAG, "Run this workflow on the version tag"'
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Build Linux packages and run native ABI smoke tests
        run: |
          python scripts/version.py --check
          python scripts/build_sdk.py --target desktop --output dist/assets
          python scripts/build_python.py --output dist/assets
      - name: Audit and record exact package files
        run: python scripts/publish_release.py record --dist dist/assets --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: |
            dist/assets/*.zip
            dist/assets/*.aar
            dist/assets/*.whl
            dist/assets/*.tar.gz
            dist/assets/*.ocrpack
            dist/assets/*.json
            dist/assets/*.txt
            dist/assets/LICENSE
            dist/assets/SHA256SUMS
          include-hidden-files: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  android:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build both AAR variants for both ABIs
        run: |
          python scripts/version.py --check
          python scripts/build_sdk.py --target android --output dist/assets
      - name: Audit and record exact package files
        run: python scripts/publish_release.py record --dist dist/assets --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: |
            dist/assets/*.zip
            dist/assets/*.aar
            dist/assets/*.whl
            dist/assets/*.tar.gz
            dist/assets/*.ocrpack
            dist/assets/*.json
            dist/assets/*.txt
            dist/assets/LICENSE
            dist/assets/SHA256SUMS
          include-hidden-files: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [linux, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/packages
      - name: Assemble same-commit assets and publish Latest
        run: |
          python scripts/publish_release.py assemble --packages dist/packages --output dist/release
          python scripts/publish_release.py publish --dist dist/release
