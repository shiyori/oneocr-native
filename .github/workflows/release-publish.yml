name: release-publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish, or main for a build-only check
        required: true
        type: string
      publish:
        description: Publish the selected stable tag after verification
        required: false
        default: true
        type: boolean
      build_run_id:
        description: Optional previous run whose completed build artifacts should be reused
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  version:
    outputs:
      build_run_id: ${{ steps.source.outputs.build_run_id }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Load publication tooling from this workflow revision
        env:
          TOOLING_COMMIT: ${{ github.workflow_sha }}
        run: git show "${TOOLING_COMMIT}:scripts/publish_release.py" > scripts/publish_release.py
      - name: Verify source and select existing build artifacts
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python scripts/version.py --check
          PYTHONPATH=scripts python - <<'PYTHON'
          import os, re, subprocess
          from version import TAG
          publishing = os.environ["PUBLISH_RELEASE"] == "true"
          if publishing:
              assert os.environ["RELEASE_TAG"] == TAG, "Select the version tag for publication"
          run = os.environ.get("BUILD_RUN_ID", "")
          if not run and publishing:
              message = subprocess.check_output(["git", "for-each-ref", "--format=%(contents)", "refs/tags/" + TAG], text=True)
              match = re.search(r"^OneOCR-Build-Run: ([0-9]+)$", message, re.MULTILINE)
              if match:
                  run = match.group(1)
          assert not run or run.isascii() and run.isdigit(), "Invalid build run id"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("build_run_id=" + run + "\n")
          PYTHON
  linux:
    if: ${{ needs.version.outputs.build_run_id == '' }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Load publication tooling from this workflow revision
        env:
          TOOLING_COMMIT: ${{ github.workflow_sha }}
        run: git show "${TOOLING_COMMIT}:scripts/publish_release.py" > scripts/publish_release.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Build complete Linux package and universal Python distribution
        run: |
          python scripts/version.py --check
          if [ -f scripts/build_linux.py ]; then
            python scripts/build_linux.py --output dist/assets
            python scripts/build_python.py --wheel-only --output dist/assets
          else
            python scripts/build_sdk.py --target desktop --output dist/assets
            python scripts/build_python.py --output dist/assets
          fi
      - name: Audit and record exact package files
        run: python scripts/publish_release.py record --dist dist/assets --platform ${{ matrix.platform }}
      - name: Verify complete package and dependency installation offline
        run: |
          if [ -f scripts/verify_linux.py ]; then
            python scripts/verify_linux.py --dist dist/assets --runtime-cache dist/assets/.upstream/downloads
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: |
            dist/assets/*.zip
            dist/assets/*.aar
            dist/assets/*.whl
            dist/assets/*.tar.gz
            dist/assets/*.ocrpack
            dist/assets/*.json
            dist/assets/*.txt
            dist/assets/LICENSE
            dist/assets/SHA256SUMS
          include-hidden-files: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  android:
    if: ${{ needs.version.outputs.build_run_id == '' }}
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Load publication tooling from this workflow revision
        env:
          TOOLING_COMMIT: ${{ github.workflow_sha }}
        run: git show "${TOOLING_COMMIT}:scripts/publish_release.py" > scripts/publish_release.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build both AAR variants for both ABIs
        run: |
          python scripts/version.py --check
          python scripts/build_sdk.py --target android --output dist/assets
      - name: Audit and record exact package files
        run: python scripts/publish_release.py record --dist dist/assets --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: |
            dist/assets/*.zip
            dist/assets/*.aar
            dist/assets/*.whl
            dist/assets/*.tar.gz
            dist/assets/*.ocrpack
            dist/assets/*.json
            dist/assets/*.txt
            dist/assets/LICENSE
            dist/assets/SHA256SUMS
          include-hidden-files: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  publish:
    if: ${{ always() && needs.version.result == 'success' && (needs.version.outputs.build_run_id || (needs.linux.result == 'success' && needs.android.result == 'success')) }}
    needs: [version, linux, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Load publication tooling from this workflow revision
        env:
          TOOLING_COMMIT: ${{ github.workflow_sha }}
        run: git show "${TOOLING_COMMIT}:scripts/publish_release.py" > scripts/publish_release.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/packages
          run-id: ${{ needs.version.outputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble and audit same-commit assets
        run: python scripts/publish_release.py assemble --packages dist/packages --output dist/release
      - name: Publish Latest
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: python scripts/publish_release.py publish --dist dist/release
