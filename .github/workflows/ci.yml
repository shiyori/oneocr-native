name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Unit tests (race detection on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            go test -race -short ./...
          else
            go test -short ./...
          fi
      - run: go vet ./...
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Verify checked-in metadata
        run: |
          python scripts/version.py --check
          python scripts/verify_models.py
      - run: python -m pip install "./python[conversion]" pytest onnxruntime==1.29.0
      - name: Python unit tests
        run: python -m pytest python/tests -m 'not integration'
