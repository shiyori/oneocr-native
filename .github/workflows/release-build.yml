name: release-build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  desktop:
    name: desktop-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-amd64
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verify version and models
        run: |
          python scripts/version.py --check
          python scripts/verify_models.py
          python -m pip install "./python[conversion]" pytest
      - name: Full CPU compatibility and original API comparisons
        run: python scripts/verify_native.py --output dist/reports/${{ matrix.platform }}
      - name: Build optional Linux packages
        if: startsWith(matrix.platform, 'linux-')
        run: |
          python scripts/build_sdk.py --target desktop --output dist/assets
          python scripts/build_python.py --output dist/assets
      - name: Build universal Python distribution
        if: runner.os != 'Linux'
        run: python scripts/build_python.py --wheel-only --output dist/assets
      - name: Prepare resource metadata
        run: python scripts/release_manifest.py --dist dist/assets --partial
      - name: Go module, Go command, Python and optional Linux consumers
        run: |
          python scripts/verify_distributions.py --dist dist/assets --report dist/reports/${{ matrix.platform }}/consumers.json
          python scripts/audit_release.py --dist dist/assets --partial --report dist/reports/${{ matrix.platform }}/audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: |
            dist/assets/*.zip
            dist/assets/*.whl
            dist/assets/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.platform }}
          path: |
            dist/reports/**/*.json
            dist/reports/**/*.log
          retention-days: 14
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Prepare SDK and emulator permissions
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build both Android ABIs
        run: |
          python scripts/build_sdk.py --target android --output dist/assets
          python scripts/release_manifest.py --dist dist/assets --partial
          python scripts/audit_release.py --dist dist/assets --partial --report dist/reports/android/audit.json
      - name: Actual Android x86_64 OCR and host coexistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python scripts/verify_android.py --aar dist/assets/oneocr-android-0.1.0.aar --abi x86_64 --report dist/reports/android/full.json
            python scripts/verify_android.py --aar dist/assets/oneocr-android-core-0.1.0.aar --abi x86_64 --host-version 1.26.0 --report dist/reports/android/host126.json
            python scripts/verify_android.py --aar dist/assets/oneocr-android-core-0.1.0.aar --abi x86_64 --host-version 1.29.0 --report dist/reports/android/host129.json
      - uses: actions/upload-artifact@v4
        with:
          name: assets-android
          path: |
            dist/assets/*.zip
            dist/assets/*.aar
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-android
          path: dist/reports/android
          retention-days: 14
